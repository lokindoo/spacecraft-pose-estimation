[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedplus-pose"
version = "1.0.0"
description = "Sim-to-real study of monocular spacecraft pose estimation on the SPEED+ benchmark"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nikolay Dolgov" }]
keywords = ["pose-estimation", "6d-pose", "satellite", "sim-to-real", "conformal-prediction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Only needed to build the subsets from the raw Zenodo download.
prepare = ["scikit-learn>=1.3", "python-dotenv>=1.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
